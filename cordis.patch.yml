# dsh-better-ptc bundle patch: one host-global row mounting every feature.
#
# Both features ride this single row: `repair` hooks tool execution globally,
# and `commands` registers per agent, gated on each agent's live preset id
# (config `commands.presets`, default `ptc`) read from the preset registry —
# so the commands are visible exactly to agents of the configured presets and
# no shipped preset row is overridden here. This file is version-independent;
# upgrading DSH does not touch it.
- insert:
    - id: better-ptc
      name: dsh-better-ptc
